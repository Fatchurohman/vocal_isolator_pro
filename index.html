<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocal Isolator Gold - HD AI Engine</title>
  <style>
    :root {
      --bg-dark: #06140e;
      --bg-card: rgba(12, 38, 27, 0.85);
      --gold-primary: #ffd700;
      --gold-secondary: #dfac20;
      --gold-gradient: linear-gradient(135deg, #fff2a3 0%, #ffd700 50%, #b8860b 100%);
      --text-light: #f0f7f4;
      --text-muted: #a3c1ad;
      --border-gold: rgba(255, 215, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.15) 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, rgba(15, 56, 38, 0.5) 0%, transparent 50%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      padding: 20px 10px;
    }

    .app-title {
      font-size: 2.2rem;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0px 4px 15px rgba(255, 215, 0, 0.2);
    }

    .developer-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(6, 20, 14, 0.8);
      border: 1px solid var(--border-gold);
      padding: 6px 16px;
      border-radius: 20px;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: var(--gold-primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gold-primary);
      animation: pulseGold 1.2s infinite alternate;
    }

    @keyframes pulseGold {
      0% {
        opacity: 0.3;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    .dev-text {
      font-size: 0.85rem;
      color: var(--gold-secondary);
      font-weight: 600;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .upload-area {
      border: 2px dashed var(--gold-secondary);
      border-radius: 12px;
      padding: 30px 15px;
      text-align: center;
      cursor: pointer;
      background: rgba(15, 56, 38, 0.3);
    }

    .file-input {
      display: none;
    }

    .btn {
      background: var(--gold-gradient);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
    }

    .mode-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .mode-btn {
      background: rgba(6, 20, 14, 0.6);
      border: 1px solid var(--border-gold);
      color: var(--text-light);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .mode-btn.active {
      background: var(--gold-gradient);
      color: #000;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--gold-secondary);
      text-align: center;
    }

    .slider-group {
      margin-top: 15px;
    }

    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--gold-secondary);
      margin-bottom: 5px;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--gold-primary);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 class="app-title">Vocal Isolator Gold</h1>
      <div class="developer-badge">
        <span class="live-dot"></span>
        <span class="dev-text">developer : fatur62</span>
      </div>
    </header>

    <div class="card">
      <div class="upload-area" id="dropArea">
        <span style="font-size: 2.5rem; display:block; margin-bottom:10px;">🎧</span>
        <p style="font-weight: 600; color: var(--gold-primary);">Pilih atau Tarik File Audio (HQ MP3/WAV)</p>
        <button class="btn" onclick="document.getElementById('audioInput').click()">Pilih Audio</button>
        <input type="file" id="audioInput" class="file-input" accept="audio/*">
      </div>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="card" id="playerCard" style="display: none;">
      <h3 style="color: var(--gold-primary); margin-bottom: 15px;">Panel Isolasi Suara Advanced</h3>
      
      <div class="mode-selector">
        <button class="mode-btn active" id="btnInstrument" onclick="setMode('instrument')">🎸 Instrumen (Hapus Vokal)</button>
        <button class="mode-btn" id="btnVocal" onclick="setMode('vocal')">🎤 Vokal Saja (Isolasi)</button>
      </div>

      <div class="slider-group">
        <label>
          <span>Tingkat Kerapian Filter (Cutoff)</span>
          <span id="cutoffVal">2200 Hz</span>
        </label>
        <input type="range" id="cutoffSlider" min="1000" max="5000" step="100" value="2200" oninput="updateFilter()">
      </div>

      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let audioBuffer = null;
    let currentMode = 'instrument';

    const audioInput = document.getElementById('audioInput');
    const statusMsg = document.getElementById('statusMsg');
    const playerCard = document.getElementById('playerCard');
    const audioPlayer = document.getElementById('audioPlayer');
    const cutoffSlider = document.getElementById('cutoffSlider');
    const cutoffVal = document.getElementById('cutoffVal');

    audioInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        processFile(e.target.files[0]);
      }
    });

    function processFile(file) {
      statusMsg.innerText = 'Menganalisis frekuensi audio...';
      const fileReader = new FileReader();

      fileReader.onload = async function(evt) {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          audioBuffer = await audioCtx.decodeAudioData(evt.result);
          playerCard.style.display = 'block';
          statusMsg.innerText = 'Audio berhasil diproses!';
          renderAudio();
        } catch (err) {
          statusMsg.innerText = 'Gagal memproses file audio.';
        }
      };
      fileReader.readAsArrayBuffer(file);
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnInstrument').classList.toggle('active', mode === 'instrument');
      document.getElementById('btnVocal').classList.toggle('active', mode === 'vocal');
      renderAudio();
    }

    function updateFilter() {
      cutoffVal.innerText = cutoffSlider.value + ' Hz';
      renderAudio();
    }

    function renderAudio() {
      if (!audioBuffer || !audioCtx) return;

      const numChannels = audioBuffer.numberOfChannels;
      if (numChannels < 2) {
        statusMsg.innerText = 'Peringatan: File audio bernilai Mono. Hasil pemisahan vokal butuh file Stereo.';
        return;
      }

      const length = audioBuffer.length;
      const sampleRate = audioBuffer.sampleRate;
      const left = audioBuffer.getChannelData(0);
      const right = audioBuffer.getChannelData(1);

      const outBuffer = audioCtx.createBuffer(2, length, sampleRate);
      const outL = outBuffer.getChannelData(0);
      const outR = outBuffer.getChannelData(1);

      const cutoffFreq = parseFloat(cutoffSlider.value);
      // Alpha filter sederhana untuk smoothing frekuensi vokal
      const dt = 1 / sampleRate;
      const rc = 1 / (2 * Math.PI * cutoffFreq);
      const alpha = dt / (rc + dt);

      let prevL = 0, prevR = 0;

      for (let i = 0; i < length; i++) {
        const l = left[i];
        const r = right[i];

        // Ekstraksi sinyal tengah (Center Channel - Vokal Utama) dan samping (Side Channel - Instrumen Stereo)
        const center = (l + r) * 0.5;
        const side = (l - r) * 0.5;

        // Dynamic High/Low Pass smoothing
        prevL = prevL + alpha * (center - prevL);

        if (currentMode === 'instrument') {
          // Menghapus vokal tengah & mempertahankan bass + instrumen stereo
          const cleanInstL = side + (l - prevL) * 0.5;
          const cleanInstR = -side + (r - prevL) * 0.5;

          // Soft Limiter agar suara tidak pecah
          outL[i] = Math.max(-1, Math.min(1, cleanInstL * 1.2));
          outR[i] = Math.max(-1, Math.min(1, cleanInstR * 1.2));
        } else {
          // Mengisolasi vokal frekuensi menengah (300Hz - Cutoff)
          const isolatedVocal = prevL * 1.4;
          
          outL[i] = Math.max(-1, Math.min(1, isolatedVocal));
          outR[i] = Math.max(-1, Math.min(1, isolatedVocal));
        }
      }

      const wavBlob = bufferToWave(outBuffer, length);
      const curTime = audioPlayer.currentTime;
      const isPlaying = !audioPlayer.paused;

      audioPlayer.src = URL.createObjectURL(wavBlob);
      audioPlayer.currentTime = curTime;
      if (isPlaying) audioPlayer.play();
    }

    function bufferToWave(abuffer, len) {
      const numOfChan = abuffer.numberOfChannels;
      const length = len * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let channels = [], i, sample, offset = 0, pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
      setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
      setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164);
      setUint32(length - pos - 4);

      for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

      while (offset < len) {
        for (i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }
      return new Blob([out], { type: "audio/wav" });
    }
  </script>
</body>
</html>
