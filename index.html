<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocal Isolator Gold - Live Audio Engine</title>
  <style>
    :root {
      --bg-dark: #06140e;
      --bg-card: rgba(12, 38, 27, 0.85);
      --gold-primary: #ffd700;
      --gold-secondary: #dfac20;
      --gold-gradient: linear-gradient(135deg, #fff2a3 0%, #ffd700 50%, #b8860b 100%);
      --text-light: #f0f7f4;
      --text-muted: #a3c1ad;
      --border-gold: rgba(255, 215, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.15) 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, rgba(15, 56, 38, 0.5) 0%, transparent 50%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      padding: 20px 10px;
    }

    .app-title {
      font-size: 2.2rem;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0px 4px 15px rgba(255, 215, 0, 0.2);
    }

    .developer-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(6, 20, 14, 0.8);
      border: 1px solid var(--border-gold);
      padding: 6px 16px;
      border-radius: 20px;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: var(--gold-primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gold-primary);
      animation: pulseGold 1.2s infinite alternate;
    }

    @keyframes pulseGold {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    .dev-text {
      font-size: 0.85rem;
      color: var(--gold-secondary);
      font-weight: 600;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .upload-area {
      border: 2px dashed var(--gold-secondary);
      border-radius: 12px;
      padding: 30px 15px;
      text-align: center;
      cursor: pointer;
      background: rgba(15, 56, 38, 0.3);
    }

    .file-input { display: none; }

    .btn {
      background: var(--gold-gradient);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
    }

    .mode-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .mode-btn {
      background: rgba(6, 20, 14, 0.6);
      border: 1px solid var(--border-gold);
      color: var(--text-light);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .mode-btn.active {
      background: var(--gold-gradient);
      color: #000;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--gold-secondary);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 class="app-title">Vocal Isolator Gold</h1>
      <div class="developer-badge">
        <span class="live-dot"></span>
        <span class="dev-text">developer : fatur62</span>
      </div>
    </header>

    <div class="card">
      <div class="upload-area" id="dropArea">
        <span style="font-size: 2.5rem; display:block; margin-bottom:10px;">🎧</span>
        <p style="font-weight: 600; color: var(--gold-primary);">Pilih File Audio (MP3 / WAV)</p>
        <button class="btn" onclick="document.getElementById('audioInput').click()">Pilih Audio</button>
        <input type="file" id="audioInput" class="file-input" accept="audio/*">
      </div>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="card" id="playerCard" style="display: none;">
      <h3 style="color: var(--gold-primary); margin-bottom: 15px;">Mode Suara Real-time</h3>
      
      <div class="mode-selector">
        <button class="mode-btn active" id="btnInstrument" onclick="setMode('instrument')">🎸 Mode Musik (Karaoke)</button>
        <button class="mode-btn" id="btnVocal" onclick="setMode('vocal')">🎤 Mode Vokal (Isolasi)</button>
      </div>

      <audio id="audioPlayer" controls crossorigin="anonymous"></audio>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let sourceNode = null;
    let splitterNode = null;
    let inverterNode = null;
    let filterNode = null;
    let mergerNode = null;
    let isNodeConnected = false;

    const audioInput = document.getElementById('audioInput');
    const statusMsg = document.getElementById('statusMsg');
    const playerCard = document.getElementById('playerCard');
    const audioPlayer = document.getElementById('audioPlayer');

    audioInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        loadFile(e.target.files[0]);
      }
    });

    function loadFile(file) {
      statusMsg.innerText = 'Memuat audio: ' + file.name;
      const fileUrl = URL.createObjectURL(file);
      audioPlayer.src = fileUrl;
      playerCard.style.display = 'block';

      audioPlayer.oncanplay = () => {
        statusMsg.innerText = 'Audio siap diputar!';
      };

      audioPlayer.onerror = () => {
        statusMsg.innerText = 'Gagal memutar audio. Coba file MP3 lain.';
      };
    }

    function initAudioGraph() {
      if (isNodeConnected) return;

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sourceNode = audioCtx.createMediaElementSource(audioPlayer);

      // Node untuk manipulasi stereo
      splitterNode = audioCtx.createChannelSplitter(2);
      inverterNode = audioCtx.createGain();
      filterNode = audioCtx.createBiquadFilter();
      mergerNode = audioCtx.createChannelMerger(2);

      // Konfigurasi Filter Vokal (Bandpass 300Hz - 3000Hz)
      filterNode.type = 'bandpass';
      filterNode.frequency.value = 1000;
      filterNode.Q.value = 1.0;

      // Inversi Fase Sinyal Kanan
      inverterNode.gain.value = -1;

      applyRouting('instrument');
      isNodeConnected = true;
    }

    function setMode(mode) {
      document.getElementById('btnInstrument').classList.toggle('active', mode === 'instrument');
      document.getElementById('btnVocal').classList.toggle('active', mode === 'vocal');

      if (!isNodeConnected) {
        initAudioGraph();
      } else {
        applyRouting(mode);
      }
    }

    function applyRouting(mode) {
      if (!audioCtx) return;

      // Disconnect semua rute terdahulu
      sourceNode.disconnect();
      splitterNode.disconnect();
      inverterNode.disconnect();
      filterNode.disconnect();
      mergerNode.disconnect();

      if (mode === 'instrument') {
        // Hapus Vokal Tengah (Phase Inversion Real-time)
        sourceNode.connect(splitterNode);
        splitterNode.connect(mergerNode, 0, 0); // Kiri langsung
        splitterNode.connect(inverterNode, 1);  // Kanan dibalik fasenya
        inverterNode.connect(mergerNode, 0, 1);  // Gabung ke Output
        mergerNode.connect(audioCtx.destination);
      } else {
        // Mode Isolasi Vokal (Bandpass Filter Sinyal Tengah)
        sourceNode.connect(filterNode);
        filterNode.connect(audioCtx.destination);
      }
    }

    audioPlayer.addEventListener('play', () => {
      if (!isNodeConnected) {
        initAudioGraph();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });
  </script>
</body>
</html>
